{% extends 'base.html' %}

{% block title %}Edit Refund{% endblock %}

{% block content %}
<h1>Refund Edit</h1>
<div>
  <a href="/" class="btn btn-purple btn-small margin-bottom-20 inline">Back To Landing Page</a>
  <a href="/refunds_view" class="btn btn-blue btn-small margin-bottom-20 inline">Back To Refunds View Page</a>
</div>

<form method="post" action="/refund_edit/{{ refund.id }}">
  <label>Item ID:</label>
  <input type="number" name="item_id" value="{{ refund.item_id if refund.item_id is not none else '' }}"><br><br>

  <label>Refund Amount (USD):</label>
  <input type="number" name="refund_amount_usd" step="any" value="{{ refund.refund_amount_usd }}" required><br><br>

  <label>Refund Date:</label>
  <input type="date" name="refund_date" value="{{ refund.refund_date }}" required><br><br>

  <label>Refund Reason:</label>
  <select name="refund_reason">
    {% for refund_reason in refund_reason_enum %}
      <option value="{{ refund_reason.name }}" {% if refund.refund_reason == refund_reason %}selected{% endif %}>
        {{ refund_reason.name.title().replace('_', ' ') }}
      </option>
    {% endfor %}
  </select><br><br>

  <label>USD to JPY Rate:</label>
  <input type="number" name="usd_to_jpy_rate" step="any" value="{{ refund.usd_to_jpy_rate }}" required><br><br>

  <button type="submit">Save Changes</button>
</form>

{% if error_message %}
  <div class="error-message" style="color: red; margin-top: 1em;">
    {{ error_message }}
  </div>
{% endif %}
{% endblock %}
